name: Update Bing Wallpaper

on:
  schedule:
    # UTC 09:00 == 北京时间 17:00
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bing-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Run Java Application
        run: java -jar target/bing-wallpaper-jar-with-dependencies.jar

      - name: Commit and push
        run: |
          git config --local user.email "101170810+ichenc@users.noreply.github.com"
          git config --local user.name "ichenc"
          git add README.md bing-wallpaper.md picture docs
          git commit -m "update readme.md" || echo "nothing to commit"
          git push
